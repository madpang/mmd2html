# Build and test mmd2html with the Gradle Wrapper.
# The jobs run inside the Dev Container image published by dev-image.yml, so CI uses the same GraalVM JDK as local development.
# Forks also pull the upstream image, which must therefore be public.

name: Java CI with Gradle

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Run on pushes to the default branch, and on pull requests to any branch.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/madpang/mmd2html/mmd2html-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user `ubuntu` cannot write the workspace mounted by the runner.
      options: --user root

    steps:
    - uses: actions/checkout@v6

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # `build` also runs the unit tests.
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/reports/tests/test/
        retention-days: 14

  dependency-submission:
    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/madpang/mmd2html/mmd2html-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
    - uses: actions/checkout@v6

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v5
